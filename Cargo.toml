[package]
name = "netease-cloud-music-gtk4"
version = "2.5.4"
edition = "2024"

[dependencies]
gettext-rs = { version = "~0.7", features = ["gettext-system"] }
gtk = { version = "~0.11", package = "gtk4", features = ["gnome_46"] }
once_cell = "~1.21"
qrcode-generator = "~5.0"
# ncm-api 2.1.0 已包含 special_type 字段（PR #19）
ncm-api = { git = "https://github.com/gmg137/netease-cloud-music-api.git", tag = "2.2.0", package = "netease-cloud-music-api" }
anyhow = "~1.0"
gstreamer = "~0.25"
gstreamer-play = "~0.25"
fastrand = "~2.3"
mpris-server = "~0.9"
regex = "~1.12"
log = "~0.4"
env_logger = "~0.11"
cookie_store = "~0.22"
chrono = "~0.4"
async-channel = "~2.5"
ksni = "~0.2"
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
encoding_rs = "0.8"
futures-lite = "2"
rustix = { version = "1", features = ["fs", "process"] }
id3 = "1"
gstreamer-pbutils = "~0.25"

[dependencies.adw]
package = "libadwaita"
version = "~0.9"
features = ["v1_6"]


[package.metadata.bundle]
icon = ["data/icons/hicolor/512x512@2x.png"]
osx_minimum_system_version = "11.0"

[patch."https://github.com/gmg137/netease-cloud-music-api.git"]
netease-cloud-music-api = { path = "vendor/netease-cloud-music-api" }
